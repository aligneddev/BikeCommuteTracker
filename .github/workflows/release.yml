name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        type: string
        required: false
        description: "Version to release — defaults to version in package.json"
      pre_release:
        type: boolean
        default: false
        description: "Mark as pre-release?"
      dry_run:
        type: boolean
        default: false
        description: "Build and package without publishing a GitHub Release"

permissions:
  contents: write

env:
  CI: "true"
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

# ---------------------------------------------------------------------------
# Job 1: Build the Vite frontend once; downstream packaging jobs reuse dist/
# ---------------------------------------------------------------------------
jobs:
  build-frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/BikeTracking.Frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: src/BikeTracking.Frontend
        run: npm ci --ignore-scripts

      # T026: Version consistency — package.json version must match Cargo.toml version
      - name: Verify version consistency (package.json vs Cargo.toml)
        working-directory: src/BikeTracking.Frontend
        run: |
          PKG_VER=$(node -p "require('./package.json').version")
          CARGO_VER=$(grep -m1 '^version' src-tauri/Cargo.toml | sed 's/.*= "//' | tr -d '"')
          if [ "$PKG_VER" != "$CARGO_VER" ]; then
            echo "Version mismatch: package.json=${PKG_VER} but Cargo.toml=${CARGO_VER}"
            echo "Run release-please or manually sync versions before pushing a tag."
            exit 1
          fi
          echo "Version OK: ${PKG_VER}"

      - name: Build frontend
        working-directory: src/BikeTracking.Frontend
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: src/BikeTracking.Frontend/dist/
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Job 2: Package for Windows (NSIS .exe)  [parallel with package-linux]
  # ---------------------------------------------------------------------------
  package-windows:
    name: Package Windows (NSIS)
    runs-on: windows-latest
    needs: [build-frontend, publish-api-windows]
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Cache Rust build artefacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src/BikeTracking.Frontend/src-tauri/target/
          key: windows-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: windows-cargo-

      - name: Install Rust stable
        run: rustup toolchain install stable

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: src/BikeTracking.Frontend/dist/

      - name: Install frontend dependencies
        working-directory: src/BikeTracking.Frontend
        run: npm ci --ignore-scripts

      - name: Download API binary (Windows)
        uses: actions/download-artifact@v4
        with:
          name: api-binary-windows
          path: src/BikeTracking.Frontend/src-tauri/binaries/

      - name: Build Windows installer
        working-directory: src/BikeTracking.Frontend
        run: npx tauri build --bundles nsis --ci

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: src/BikeTracking.Frontend/src-tauri/target/release/bundle/nsis/BikeTracking_*_x64-setup.exe
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Job 3: Package for Linux (.deb)  [parallel with package-windows]
  # ---------------------------------------------------------------------------
  package-linux:
    name: Package Linux (.deb)
    runs-on: ubuntu-latest
    needs: [build-frontend, publish-api-linux]
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Cache Rust build artefacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src/BikeTracking.Frontend/src-tauri/target/
          key: linux-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: linux-cargo-

      - name: Install Rust stable
        run: rustup toolchain install stable

      - name: Install Tauri system libraries
        run: |
          sudo sed -i 's|mirror+file:/etc/apt/apt-mirrors.txt|http://archive.ubuntu.com/ubuntu/|g' /etc/apt/sources.list.d/ubuntu.sources
          for i in 1 2 3; do
            sudo apt-get update && \
            sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev && break
            echo "apt install failed (attempt $i), retrying in 10s..."
            sleep 10
          done

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: src/BikeTracking.Frontend/dist/

      - name: Install frontend dependencies
        working-directory: src/BikeTracking.Frontend
        run: npm ci --ignore-scripts

      - name: Download API binary (Linux)
        uses: actions/download-artifact@v4
        with:
          name: api-binary-linux
          path: src/BikeTracking.Frontend/src-tauri/binaries/

      - name: Mark API binary executable
        run: chmod +x src/BikeTracking.Frontend/src-tauri/binaries/BikeTracking.Api-x86_64-unknown-linux-gnu

      - name: Build Linux .deb package
        working-directory: src/BikeTracking.Frontend
        run: npx tauri build --bundles deb --ci

      - name: Upload Linux .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: src/BikeTracking.Frontend/src-tauri/target/release/bundle/deb/BikeTracking_*_amd64.deb
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Job 2b: Publish self-contained API binary for Windows x64
  # ---------------------------------------------------------------------------
  publish-api-windows:
    name: Publish API binary (Windows)
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET from global.json
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore .NET dependencies
        run: dotnet restore src/BikeTracking.Api/BikeTracking.Api.csproj --runtime win-x64

      - name: Publish API self-contained (Windows x64)
        run: |
          dotnet publish src/BikeTracking.Api/BikeTracking.Api.csproj `
            --configuration Release `
            --self-contained true `
            --runtime win-x64 `
            -p:PublishSingleFile=true `
            --output api-publish-win/ `
            --no-restore

      - name: Rename binary to Tauri sidecar naming convention
        run: Rename-Item api-publish-win/BikeTracking.Api.exe BikeTracking.Api-x86_64-pc-windows-msvc.exe

      - name: Upload API binary artefact (Windows)
        uses: actions/upload-artifact@v4
        with:
          name: api-binary-windows
          path: api-publish-win/BikeTracking.Api-x86_64-pc-windows-msvc.exe
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Job 2c: Publish self-contained API binary for Linux x64
  # ---------------------------------------------------------------------------
  publish-api-linux:
    name: Publish API binary (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET from global.json
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore .NET dependencies
        run: dotnet restore src/BikeTracking.Api/BikeTracking.Api.csproj --runtime linux-x64

      - name: Publish API self-contained (Linux x64)
        run: |
          dotnet publish src/BikeTracking.Api/BikeTracking.Api.csproj \
            --configuration Release \
            --self-contained true \
            --runtime linux-x64 \
            -p:PublishSingleFile=true \
            --output api-publish-linux/ \
            --no-restore

      - name: Rename binary and mark executable
        run: |
          mv api-publish-linux/BikeTracking.Api \
             api-publish-linux/BikeTracking.Api-x86_64-unknown-linux-gnu
          chmod +x api-publish-linux/BikeTracking.Api-x86_64-unknown-linux-gnu

      - name: Upload API binary artefact (Linux)
        uses: actions/upload-artifact@v4
        with:
          name: api-binary-linux
          path: api-publish-linux/BikeTracking.Api-x86_64-unknown-linux-gnu
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Job 3b: API smoke test — verify .NET API starts and /health responds
  # ---------------------------------------------------------------------------
  smoke-test-api:
    name: API smoke test
    runs-on: ubuntu-latest
    needs: [build-frontend]
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET from global.json
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore .NET dependencies
        run: dotnet restore BikeTracking.slnx

      - name: Publish API self-contained
        run: |
          dotnet publish src/BikeTracking.Api/BikeTracking.Api.csproj \
            --configuration Release \
            --self-contained false \
            --output /tmp/api-publish \
            --no-restore

      - name: Start API and verify /health
        run: |
          ASPNETCORE_URLS="http://localhost:5436" \
          ASPNETCORE_ENVIRONMENT="Production" \
            /tmp/api-publish/BikeTracking.Api &
          API_PID=$!
          echo "API PID: $API_PID"

          # Wait up to 30s for /health to respond 200
          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5436/health || true)
            if [ "$STATUS" = "200" ]; then
              echo "API healthy after ${i}s"
              kill $API_PID
              exit 0
            fi
            sleep 1
          done

          echo "ERROR: API did not become healthy within 30s"
          kill $API_PID 2>/dev/null || true
          exit 1

  # ---------------------------------------------------------------------------
  # Job 4: Publish GitHub Release (skipped when dry_run: true)
  # ---------------------------------------------------------------------------
  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [package-linux, package-windows, smoke-test-api]
    if: ${{ !inputs.dry_run }}
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # T017: Resolve tag from push event or workflow_dispatch input
      - name: Resolve release tag
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${{ github.ref_name }}"
            AUTO_BUMP=false
          elif [ -n "${{ inputs.version }}" ]; then
            TAG="v${{ inputs.version }}"
            AUTO_BUMP=false
          else
            # Auto-increment minor version from latest published release
            LATEST=$(gh release list --limit 1 --json tagName -q '.[0].tagName' 2>/dev/null || true)
            [ -z "$LATEST" ] && LATEST="v0.0.0"
            MAJOR=$(echo "$LATEST" | sed 's/v\([0-9]*\)\..*/\1/')
            MINOR=$(echo "$LATEST" | sed 's/v[0-9]*\.\([0-9]*\)\..*/\1/')
            MINOR=$((MINOR + 1))
            TAG="v${MAJOR}.${MINOR}.0"
            AUTO_BUMP=true
          fi
          echo "TAG=${TAG}" >> "$GITHUB_ENV"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "AUTO_BUMP=${AUTO_BUMP}" >> "$GITHUB_OUTPUT"
          echo "Resolved release tag: ${TAG}"

      # Patch package.json + Cargo.toml in CI workspace only (no commit to main).
      # release-please handles version bumps in the repo via PRs.
      # This step ensures the built artifacts carry the correct version number.
      - name: Patch version files for build (workspace only)
        if: steps.tag.outputs.AUTO_BUMP == 'true'
        run: |
          NEW_VER="${TAG#v}"
          jq --arg ver "$NEW_VER" '.version = $ver' \
            src/BikeTracking.Frontend/package.json > /tmp/pkg.json \
            && mv /tmp/pkg.json src/BikeTracking.Frontend/package.json
          sed -i "0,/^version = /s/^version = .*/version = \"${NEW_VER}\"/" \
            src/BikeTracking.Frontend/src-tauri/Cargo.toml

      # T018: isDraft-aware duplicate-tag guard
      - name: Duplicate-tag guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IS_DRAFT=$(gh release view "$TAG" --json isDraft -q '.isDraft' 2>/dev/null || echo "not_found")
          if [ "$IS_DRAFT" = "false" ]; then
            echo "ERROR: Release ${TAG} already published."
            echo "Delete the tag and release first: gh release delete ${TAG} --cleanup-tag -y"
            exit 1
          elif [ "$IS_DRAFT" = "true" ]; then
            echo "Updating existing draft release ${TAG} with artefacts."
          else
            echo "Creating new release ${TAG}."
          fi

      # T027: Pre-release detection from tag name
      - name: Detect pre-release
        id: prerelease
        run: |
          if [[ "$TAG" == *-* ]]; then
            echo "IS_PRERELEASE=true"  >> "$GITHUB_ENV"
            echo "MAKE_LATEST=false"   >> "$GITHUB_ENV"
            echo "IS_PRERELEASE=true"  >> "$GITHUB_OUTPUT"
            echo "MAKE_LATEST=false"   >> "$GITHUB_OUTPUT"
          else
            echo "IS_PRERELEASE=false" >> "$GITHUB_ENV"
            echo "MAKE_LATEST=true"    >> "$GITHUB_ENV"
            echo "IS_PRERELEASE=false" >> "$GITHUB_OUTPUT"
            echo "MAKE_LATEST=true"    >> "$GITHUB_OUTPUT"
          fi

      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: release-artifacts/

      - name: Download Linux .deb artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-deb
          path: release-artifacts/

      # T019: SHA-256 checksums formatted as Markdown table
      - name: Generate SHA-256 checksums
        id: checksums
        run: |
          cd release-artifacts
          echo "## Checksums" > checksums.md
          echo "" >> checksums.md
          echo "| Artifact | SHA-256 |" >> checksums.md
          echo "|----------|---------|" >> checksums.md
          for f in *; do
            HASH=$(sha256sum "$f" | awk '{print $1}')
            echo "| $f | \`${HASH}\` |" >> checksums.md
          done
          cat checksums.md
          # Export as multiline env var for the release body
          {
            echo "CHECKSUM_TABLE<<EOF"
            cat checksums.md
            echo "EOF"
          } >> "$GITHUB_ENV"

      # T020: Create / update the GitHub Release with artifacts
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: "BikeTracking ${{ env.TAG }}"
          body: ${{ env.CHECKSUM_TABLE }}
          files: release-artifacts/*
          fail_on_unmatched_files: true
          draft: false
          prerelease: ${{ steps.prerelease.outputs.IS_PRERELEASE }}
          make_latest: ${{ steps.prerelease.outputs.MAKE_LATEST }}
