name: ci

on:
  pull_request:
      branches:
        - main
    
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    name: Verify
    env:
      CI: "true"
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET from global.json
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/BikeTracking.Frontend/package-lock.json

      - name: Restore .NET dependencies
        run: dotnet restore BikeTracking.slnx

      - name: Run backend tests
        run: dotnet test BikeTracking.slnx --configuration Release --no-restore --verbosity minimal

      - name: Install frontend dependencies
        working-directory: src/BikeTracking.Frontend
        run: npm ci --ignore-scripts

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('src/BikeTracking.Frontend/package-lock.json') }}
          restore-keys: playwright-chromium-

      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: src/BikeTracking.Frontend
        run: npx playwright install chromium

      - name: Install Playwright system dependencies
        working-directory: src/BikeTracking.Frontend
        run: npx playwright install-deps chromium

      - name: Frontend lint
        working-directory: src/BikeTracking.Frontend
        run: npm run lint

      - name: Frontend build
        working-directory: src/BikeTracking.Frontend
        run: npm run build

      - name: Install Rust toolchain (for Tauri config check)
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Cache Rust build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src/BikeTracking.Frontend/src-tauri/target/
          key: linux-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: linux-cargo-

      - name: Install Tauri system libraries
        run: sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Tauri config check
        working-directory: src/BikeTracking.Frontend
        run: npx tauri build --bundles deb --debug --ci

      - name: Frontend unit tests
        working-directory: src/BikeTracking.Frontend
        run: npm run test:unit

      - name: Frontend end-to-end tests
        working-directory: src/BikeTracking.Frontend
        run: npm run test:e2e

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14

      - name: Cleanup sqlite files
        if: always()
        run: |
          rm -f biketracking.local.db
          rm -f biketracking.local.db-shm
          rm -f biketracking.local.db-wal
