name: ci

on:
  pull_request:
      branches:
        - main
    
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    name: Verify
    env:
      CI: "true"
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET from global.json
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/BikeTracking.Frontend/package-lock.json

      - name: Restore .NET dependencies
        run: dotnet restore BikeTracking.slnx

      - name: Run backend tests
        run: dotnet test BikeTracking.slnx --configuration Release --no-restore --verbosity minimal

      - name: Install frontend dependencies
        working-directory: src/BikeTracking.Frontend
        run: npm ci --ignore-scripts

      - name: Frontend lint
        working-directory: src/BikeTracking.Frontend
        run: npm run lint

      - name: Frontend build
        working-directory: src/BikeTracking.Frontend
        run: npm run build

      - name: Install Rust toolchain (for Tauri config check)
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Cache Rust build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src/BikeTracking.Frontend/src-tauri/target/
          key: linux-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: linux-cargo-

      - name: Install Tauri system libraries
        run: sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Publish API sidecar binary (Linux x64)
        run: |
          dotnet publish src/BikeTracking.Api/BikeTracking.Api.csproj \
            --configuration Release \
            --self-contained true \
            --runtime linux-x64 \
            -p:PublishSingleFile=true \
            --output src/BikeTracking.Frontend/src-tauri/binaries/
          mv src/BikeTracking.Frontend/src-tauri/binaries/BikeTracking.Api \
             src/BikeTracking.Frontend/src-tauri/binaries/BikeTracking.Api-x86_64-unknown-linux-gnu
          chmod +x src/BikeTracking.Frontend/src-tauri/binaries/BikeTracking.Api-x86_64-unknown-linux-gnu

      - name: Tauri config check
        working-directory: src/BikeTracking.Frontend
        run: npx tauri build --bundles deb --debug --ci

      - name: Frontend unit tests
        working-directory: src/BikeTracking.Frontend
        run: npm run test:unit

  e2e:
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 20
    name: E2E Tests
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
    env:
      CI: "true"
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      HOME: /root

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET from global.json
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore .NET dependencies
        run: dotnet restore BikeTracking.slnx

      - name: Install frontend dependencies
        working-directory: src/BikeTracking.Frontend
        run: npm ci --ignore-scripts

      - name: Frontend end-to-end tests
        working-directory: src/BikeTracking.Frontend
        run: npm run test:e2e

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            src/BikeTracking.Frontend/playwright-report
            src/BikeTracking.Frontend/test-results
          if-no-files-found: ignore
          retention-days: 14

      - name: Cleanup sqlite files
        if: always()
        run: |
          rm -f biketracking.local.db
          rm -f biketracking.local.db-shm
          rm -f biketracking.local.db-wal
          rm -f src/BikeTracking.Api/biketracking.e2e.db
